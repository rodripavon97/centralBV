name: Build React App

on:
  push:
    branches: [master, develop, feat/us60-testE2E]
  pull_request:
    branches: [master, develop, feat/us60-testE2E]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # `vitest` aplica los umbrales de coverage de vitest.config.ts:
      # si statements/branches/functions/lines bajan del piso, el job falla.
      - name: Run the tests and generate coverage report
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const archivo = "coverage/coverage-summary.json";
          if (!fs.existsSync(archivo)) {
            console.log("No se generó coverage/coverage-summary.json");
            process.exit(0);
          }
          const total = JSON.parse(fs.readFileSync(archivo, "utf8")).total;
          const filas = ["statements", "branches", "functions", "lines"]
            .map((clave) => `| ${clave} | ${total[clave].pct}% (${total[clave].covered}/${total[clave].total}) |`)
            .join("\n");
          const salida = `### Cobertura de tests\n\n| Métrica | Cobertura |\n| --- | --- |\n${filas}\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, salida);
          console.log(salida);
          NODE

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
